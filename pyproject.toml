[project]
name = "smart-data-inspector"
version = "0.3.0"
description = "A small CLI and Streamlit UI for inspecting CSV, JSON and Parquet datasets with Markdown/JSON reports."
readme = "README.md"
authors = [
    {name = "Tanweerul Haque",email = "tan.haque@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.1",
    "numpy>=1.26,<3",
    "rich>=13.9,<15",
    "matplotlib>=3.8,<4",
    "pyarrow>=15",
    "ijson (>=3.3)",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ui = ["streamlit>=1.38,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[project.scripts]
sdi = "smart_data_inspector.cli.main:main"
smart-data-inspector = "smart_data_inspector.cli.main:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
